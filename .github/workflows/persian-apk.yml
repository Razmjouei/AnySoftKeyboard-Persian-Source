
name: Build Persian AnySoftKeyboard APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3

      - name: Set up Java 21
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3.2.2
        with:
          cmdline-tools-version: 13114758

      - name: Install Android NDK
        run: sdkmanager "ndk;29.0.14206865"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Prepare Android environment
        run: ./scripts/ci/ci_setup.sh

      - name: Build Persian APK
        run: ./gradlew :addons:languages:persian:apk:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v6.0.0
        with:
          name: Persian-Keyboard-APK
          path: addons/languages/persian/apk/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
